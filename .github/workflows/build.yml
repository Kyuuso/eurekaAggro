name: Build and Release

on:
  push:
    branches: [ main, master, 'feature/*' ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extract plugin version
        shell: pwsh
        run: |
          $manifest = Get-Content EurekaSuite.json -Raw | ConvertFrom-Json
          $rawVer = $manifest.AssemblyVersion
          if ([string]::IsNullOrWhiteSpace($rawVer)) { $rawVer = "1.0.0.0" }
          
          $parts = $rawVer.Split('.')
          $baseVer = if ($parts.Length -ge 3) { "$($parts[0]).$($parts[1]).$($parts[2])" } else { $rawVer }
          
          # Detect feature branch or preview mode
          $isFeatureBranch = ($env:GITHUB_REF -like "refs/heads/feature/*")
          if ($isFeatureBranch) {
              $branchName = $env:GITHUB_REF -replace "refs/heads/", ""
              $tagName = "v$baseVer-preview"
              $isPrerelease = "true"
              $isTestingOnly = "true"
              Write-Host "Detected feature branch ($branchName). Configuring PREVIEW build ($tagName)"
          } else {
              $tagName = "v$baseVer"
              $isPrerelease = "false"
              $isTestingOnly = "false"
              Write-Host "Target version: $rawVer (Tag: $tagName)"
          }
          
          echo "PLUGIN_VERSION=$rawVer" >> $env:GITHUB_ENV
          echo "TAG_NAME=$tagName" >> $env:GITHUB_ENV
          echo "IS_PRERELEASE=$isPrerelease" >> $env:GITHUB_ENV
          echo "IS_TESTING_ONLY=$isTestingOnly" >> $env:GITHUB_ENV

      - name: Download and extract Dalamud
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://goatcorp.github.io/dalamud-distrib/latest.zip' -OutFile 'dalamud.zip'
          Expand-Archive -Path 'dalamud.zip' -DestinationPath 'dalamud'
          $dalamudFull = (Resolve-Path 'dalamud').Path
          echo "DALAMUD_DIR=$dalamudFull" >> $env:GITHUB_ENV

      - name: Build plugin (Release)
        shell: pwsh
        run: |
          dotnet build -c Release EurekaSuite.csproj -p:DALAMUD_HOME="${{ env.DALAMUD_DIR }}"
          Copy-Item -Path "EurekaSuite.json" -Destination "bin/Release/EurekaSuite.json" -Force

      - name: Package plugin
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "package"
          New-Item -ItemType Directory -Force -Path "package/images"
          
          # Copiar binarios del plugin, dependencias (ECommons) y metadatos
          Copy-Item -Path "bin/Release/EurekaSuite.dll" -Destination "package/"
          Copy-Item -Path "bin/Release/EurekaSuite.json" -Destination "package/"
          Copy-Item -Path "bin/Release/EurekaSuite.pdb" -Destination "package/" -ErrorAction SilentlyContinue
          Copy-Item -Path "bin/Release/EurekaSuite.deps.json" -Destination "package/" -ErrorAction SilentlyContinue
          Copy-Item -Path "bin/Release/ECommons.dll" -Destination "package/" -ErrorAction SilentlyContinue
          Copy-Item -Path "images/icon.png" -Destination "package/images/icon.png" -Force
          Copy-Item -Path "images/icon.png" -Destination "package/icon.png" -Force
          if (Test-Path "bin/Release/BFE") {
              Copy-Item -Path "bin/Release/BFE" -Destination "package/" -Recurse -Force
          }
          
          # Strictly versioned zip for release archives
          Compress-Archive -Path "package/*" -DestinationPath "EurekaSuite-${{ env.TAG_NAME }}.zip" -Force
          
          # If building preview, also create EurekaSuite-preview.zip
          if ($env:IS_TESTING_ONLY -eq "true") {
              Copy-Item -Path "EurekaSuite-${{ env.TAG_NAME }}.zip" -Destination "EurekaSuite-preview.zip" -Force
          }

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TAG_NAME }}-package
          path: |
            EurekaSuite-${{ env.TAG_NAME }}.zip
            EurekaSuite-preview.zip
            bin/Release/EurekaSuite.json
            images/icon.png
          if-no-files-found: ignore

      - name: Create or Update Versioned GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          files: |
            EurekaSuite-${{ env.TAG_NAME }}.zip
            EurekaSuite-preview.zip
            bin/Release/EurekaSuite.json
            images/icon.png
          generate_release_notes: true

      - name: Sync to Public Plugin Repository
        if: ${{ env.SYNC_TOKEN != '' }}
        shell: pwsh
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Clone public repo using personal sync token
          git clone https://x-access-token:${{ secrets.SYNC_TOKEN }}@github.com/Kyuuso/dalamud-plugins.git public_repo
          
          New-Item -ItemType Directory -Force -Path "public_repo/plugins/EurekaSuite"
          New-Item -ItemType Directory -Force -Path "public_repo/plugins/EurekaSuite/images"
          $pmPath = "public_repo/pluginmaster.json"
          
          if ($env:IS_TESTING_ONLY -eq "true") {
              # PREVIEW / TESTING TRACK
              Write-Host "Deploying PREVIEW / Testing release to public repo..."
              Copy-Item -Path "EurekaSuite-preview.zip" -Destination "public_repo/plugins/EurekaSuite/EurekaSuite-preview.zip" -Force
              Copy-Item -Path "bin/Release/EurekaSuite.json" -Destination "public_repo/plugins/EurekaSuite/EurekaSuite.json" -Force
              Copy-Item -Path "images/icon.png" -Destination "public_repo/plugins/EurekaSuite/images/icon.png" -Force
              Copy-Item -Path "images/icon.png" -Destination "public_repo/plugins/EurekaSuite/icon.png" -Force
              
              if (Test-Path $pmPath) {
                  $pm = Get-Content $pmPath -Raw | ConvertFrom-Json
                  $previewZipUrl = "https://raw.githubusercontent.com/Kyuuso/dalamud-plugins/main/plugins/EurekaSuite/EurekaSuite-preview.zip"
                  $iconUrl = "https://raw.githubusercontent.com/Kyuuso/dalamud-plugins/main/plugins/EurekaSuite/images/icon.png"
                  
                  $target = $pm | Where-Object { $_.InternalName -eq "EurekaSuite" }
                  if (-not $target) {
                      $target = [PSCustomObject]@{
                          Author = "Kyuuso"
                          Name = "Eureka Suite"
                          InternalName = "EurekaSuite"
                          AssemblyVersion = "${{ env.PLUGIN_VERSION }}"
                          TestingAssemblyVersion = "${{ env.PLUGIN_VERSION }}"
                          TestingDalamudApiLevel = 15
                          ApplicableVersion = "any"
                          DalamudApiLevel = 15
                          IconUrl = $iconUrl
                          Description = "All-in-one quality-of-life suite for Eureka (Anemos, Pagos, Pyros, Hydatos). Features lethal aggro radar visualizers, native BFE (Bunnies for Eureka) automated bunny fate routing & treasure hunting, and real-time ffxiv-eureka.com Phoenix WebSocket tracker synchronization."
                          DownloadLinkInstall = $previewZipUrl
                          DownloadLinkUpdate = $previewZipUrl
                          DownloadLinkTesting = $previewZipUrl
                      }
                      $pmList = [System.Collections.Generic.List[object]]@($pm)
                      $pmList.Add($target)
                      $pm = $pmList.ToArray()
                  } else {
                      $target.AssemblyVersion = "${{ env.PLUGIN_VERSION }}"
                      $target.TestingAssemblyVersion = "${{ env.PLUGIN_VERSION }}"
                      $target.TestingDalamudApiLevel = 15
                      $target.DownloadLinkInstall = $previewZipUrl
                      $target.DownloadLinkUpdate = $previewZipUrl
                      $target.DownloadLinkTesting = $previewZipUrl
                      $target.IconUrl = $iconUrl
                  }
                  
                  # Also update legacy EurekaAggro entry if present so existing users receive the update
                  $legacy = $pm | Where-Object { $_.InternalName -eq "EurekaAggro" }
                  if ($legacy) {
                      $legacy.AssemblyVersion = "${{ env.PLUGIN_VERSION }}"
                      $legacy.TestingAssemblyVersion = "${{ env.PLUGIN_VERSION }}"
                      $legacy.TestingDalamudApiLevel = 15
                      $legacy.DownloadLinkInstall = $previewZipUrl
                      $legacy.DownloadLinkUpdate = $previewZipUrl
                      $legacy.DownloadLinkTesting = $previewZipUrl
                  }
                  
                  Set-Content -Path $pmPath -Value ($pm | ConvertTo-Json -Depth 10) -Encoding utf8
              }
              
              cd public_repo
              git add pluginmaster.json plugins/EurekaSuite/
              git commit -m "Auto-update EurekaSuite testing/preview release to ${{ env.PLUGIN_VERSION }}" || echo "No changes to commit"
              git push origin main || git push origin master
          } else {
              # STABLE RELEASE TRACK
              Write-Host "Deploying STABLE release to public repo..."
              Copy-Item -Path "EurekaSuite-${{ env.TAG_NAME }}.zip" -Destination "public_repo/plugins/EurekaSuite/EurekaSuite-${{ env.TAG_NAME }}.zip" -Force
              Copy-Item -Path "bin/Release/EurekaSuite.json" -Destination "public_repo/plugins/EurekaSuite/EurekaSuite.json" -Force
              Copy-Item -Path "images/icon.png" -Destination "public_repo/plugins/EurekaSuite/images/icon.png" -Force
              Copy-Item -Path "images/icon.png" -Destination "public_repo/plugins/EurekaSuite/icon.png" -Force
              
              if (Test-Path $pmPath) {
                  $pm = Get-Content $pmPath -Raw | ConvertFrom-Json
                  $versionedZipUrl = "https://raw.githubusercontent.com/Kyuuso/dalamud-plugins/main/plugins/EurekaSuite/EurekaSuite-${{ env.TAG_NAME }}.zip"
                  $iconUrl = "https://raw.githubusercontent.com/Kyuuso/dalamud-plugins/main/plugins/EurekaSuite/images/icon.png"
                  
                  $target = $pm | Where-Object { $_.InternalName -eq "EurekaSuite" }
                  if (-not $target) {
                      $target = [PSCustomObject]@{
                          Author = "Kyuuso"
                          Name = "Eureka Suite"
                          InternalName = "EurekaSuite"
                          AssemblyVersion = "${{ env.PLUGIN_VERSION }}"
                          ApplicableVersion = "any"
                          DalamudApiLevel = 15
                          IconUrl = $iconUrl
                          Description = "All-in-one quality-of-life suite for Eureka (Anemos, Pagos, Pyros, Hydatos). Features lethal aggro radar visualizers, native BFE (Bunnies for Eureka) automated bunny fate routing & treasure hunting, and real-time ffxiv-eureka.com Phoenix WebSocket tracker synchronization."
                          DownloadLinkInstall = $versionedZipUrl
                          DownloadLinkUpdate = $versionedZipUrl
                          DownloadLinkTesting = $versionedZipUrl
                      }
                      $pmList = [System.Collections.Generic.List[object]]@($pm)
                      $pmList.Add($target)
                      $pm = $pmList.ToArray()
                  } else {
                      $target.AssemblyVersion = "${{ env.PLUGIN_VERSION }}"
                      $target.DownloadLinkInstall = $versionedZipUrl
                      $target.DownloadLinkUpdate = $versionedZipUrl
                      $target.DownloadLinkTesting = $versionedZipUrl
                      $target.IconUrl = $iconUrl
                  }
                  
                  # Also update legacy EurekaAggro entry if present so existing users receive the update
                  $legacy = $pm | Where-Object { $_.InternalName -eq "EurekaAggro" }
                  if ($legacy) {
                      $legacy.AssemblyVersion = "${{ env.PLUGIN_VERSION }}"
                      $legacy.DownloadLinkInstall = $versionedZipUrl
                      $legacy.DownloadLinkUpdate = $versionedZipUrl
                      $legacy.DownloadLinkTesting = $versionedZipUrl
                  }
                  
                  Set-Content -Path $pmPath -Value ($pm | ConvertTo-Json -Depth 10) -Encoding utf8
              }
              
              cd public_repo
              git add pluginmaster.json plugins/EurekaSuite/
              git commit -m "Auto-update EurekaSuite plugin release to ${{ env.TAG_NAME }} (${{ env.PLUGIN_VERSION }})" || echo "No changes to commit"
              git push origin main || git push origin master
          }
