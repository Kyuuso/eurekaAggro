name: Build and Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extract plugin version
        shell: pwsh
        run: |
          $manifest = Get-Content EurekaAggro.json -Raw | ConvertFrom-Json
          $rawVer = $manifest.AssemblyVersion
          if ([string]::IsNullOrWhiteSpace($rawVer)) { $rawVer = "1.0.0.0" }
          
          # Short tag version: e.g. 1.0.0 from 1.0.0.0
          $parts = $rawVer.Split('.')
          $tagVer = if ($parts.Length -ge 3) { "$($parts[0]).$($parts[1]).$($parts[2])" } else { $rawVer }
          $tagName = "v$tagVer"
          
          echo "PLUGIN_VERSION=$rawVer" >> $env:GITHUB_ENV
          echo "TAG_NAME=$tagName" >> $env:GITHUB_ENV
          Write-Host "Target version: $rawVer (Tag: $tagName)"

      - name: Download and extract Dalamud
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://goatcorp.github.io/dalamud-distrib/latest.zip' -OutFile 'dalamud.zip'
          Expand-Archive -Path 'dalamud.zip' -DestinationPath 'dalamud'
          $dalamudFull = (Resolve-Path 'dalamud').Path
          echo "DALAMUD_DIR=$dalamudFull" >> $env:GITHUB_ENV

      - name: Build plugin (Release)
        shell: pwsh
        run: |
          dotnet build -c Release EurekaAggro.csproj -p:DALAMUD_HOME="${{ env.DALAMUD_DIR }}"
          Copy-Item -Path "EurekaAggro.json" -Destination "bin/Release/EurekaAggro.json" -Force

      - name: Package plugin
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "package"
          Copy-Item -Path "bin/Release/EurekaAggro.dll" -Destination "package/"
          Copy-Item -Path "bin/Release/EurekaAggro.json" -Destination "package/"
          Copy-Item -Path "bin/Release/EurekaAggro.pdb" -Destination "package/"
          Copy-Item -Path "bin/Release/EurekaAggro.deps.json" -Destination "package/"
          
          # Generic latest.zip for continuous update links
          Compress-Archive -Path "package/*" -DestinationPath "latest.zip" -Force
          
          # Versioned zip for release archives
          Compress-Archive -Path "package/*" -DestinationPath "EurekaAggro-${{ env.TAG_NAME }}.zip" -Force

      - name: Create or Update Versioned GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          files: |
            latest.zip
            EurekaAggro-${{ env.TAG_NAME }}.zip
            bin/Release/EurekaAggro.json
          generate_release_notes: true

      - name: Sync to Public Plugin Repository
        if: env.SYNC_TOKEN != ''
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        shell: pwsh
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Clone public repo using personal sync token
          git clone https://x-access-token:${{ secrets.SYNC_TOKEN }}@github.com/Kyuuso/dalamud-plugins.git public_repo
          
          # Copy new release files
          New-Item -ItemType Directory -Force -Path "public_repo/plugins/EurekaAggro"
          Copy-Item -Path "latest.zip" -Destination "public_repo/plugins/EurekaAggro/latest.zip" -Force
          Copy-Item -Path "bin/Release/EurekaAggro.json" -Destination "public_repo/plugins/EurekaAggro/EurekaAggro.json" -Force
          
          # Update version in pluginmaster.json so Dalamud client prompts update
          $pmPath = "public_repo/pluginmaster.json"
          if (Test-Path $pmPath) {
              $pmRaw = Get-Content $pmPath -Raw
              $pmUpdated = $pmRaw -replace '("AssemblyVersion"\s*:\s*")[^"]+(")', "`${1}${{ env.PLUGIN_VERSION }}`${2}"
              Set-Content -Path $pmPath -Value $pmUpdated -Encoding utf8
          }
          
          # Commit and push changes
          cd public_repo
          git add pluginmaster.json plugins/EurekaAggro/latest.zip plugins/EurekaAggro/EurekaAggro.json
          git commit -m "Auto-update EurekaAggro plugin release to ${{ env.TAG_NAME }} (${{ env.PLUGIN_VERSION }})" || echo "No changes to commit"
          git push origin main || git push origin master
